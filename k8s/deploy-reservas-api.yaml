apiVersion: apps/v1
kind: Deployment

metadata:
  name: reservas-api
  namespace: reservas-app

spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: reservas-api

  template:
    metadata:
      labels:
        app: reservas-api

    spec:
      containers:
        - name: reservas-api
          image: cristianvillafane/reservas-api:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 3000

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              memory: "512Mi"

          envFrom:
            - configMapRef:
                name: reservas-api-config

          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: reservas-db-secret
                  key: MYSQL_USER

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservas-db-secret
                  key: MYSQL_PASSWORD

          startupProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            failureThreshold: 24

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            periodSeconds: 5
            timeoutSeconds: 3
