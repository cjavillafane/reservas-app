apiVersion: apps/v1
kind: Deployment

metadata:
  name: reservas-frontend
  namespace: reservas-app

spec:
  replicas: 2

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0

  selector:
    matchLabels:
      app: reservas-frontend

  template:
    metadata:
      labels:
        app: reservas-frontend

    spec:
      containers:
        - name: reservas-frontend
          image: cristianvillafane/reservas-frontend:v1
          imagePullPolicy: Always

          ports:
            - containerPort: 8080

          envFrom:
            - configMapRef:
                name: reservas-frontend-config

          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            failureThreshold: 12

          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 5
            timeoutSeconds: 3
