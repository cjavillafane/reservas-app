services:

  reservas-db:
    image: mysql:8.4
    container_name: reservas-db
    restart: unless-stopped

    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID

    environment:
      MYSQL_DATABASE: reservasdb
      MYSQL_USER: reservas_user
      MYSQL_PASSWORD: reservas_pass
      MYSQL_ROOT_PASSWORD: reservas_root_pass

    volumes:
      - reservas-db-data:/var/lib/mysql

    networks:
      - reservas-net

    healthcheck:
      test:
        - CMD-SHELL
        - 'mysqladmin ping -h 127.0.0.1 -u root -p"$$MYSQL_ROOT_PASSWORD" --silent'
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 40s


  reservas-api:
    build:
      context: ./backend
      dockerfile: Dockerfile

    image: reservas-api:v1
    container_name: reservas-api
    restart: unless-stopped

    cap_drop:
      - ALL

    environment:
      PORT: "3000"
      DB_HOST: reservas-db
      DB_PORT: "3306"
      DB_NAME: reservasdb
      DB_USER: reservas_user
      DB_PASSWORD: reservas_pass
      APP_VERSION: v1
      SEED_DEMO: "true"

    ports:
      - "3001:3000"

    networks:
      - reservas-net

    depends_on:
      reservas-db:
        condition: service_healthy

    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 15s


  reservas-frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    image: reservas-frontend:v1
    container_name: reservas-frontend
    restart: unless-stopped

    cap_drop:
      - ALL

    environment:
      API_HOST: reservas-api
      API_PORT: "3000"
      NGINX_ENVSUBST_FILTER: "^API_"

    ports:
      - "3000:8080"

    networks:
      - reservas-net

    depends_on:
      reservas-api:
        condition: service_healthy

    healthcheck:
      test:
        - CMD-SHELL
        - "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s


networks:
  reservas-net:
    name: reservas-net
    driver: bridge


volumes:
  reservas-db-data:
    name: reservas-db-data
    external: true
