apiVersion: v1
kind: Secret
metadata:
  name: reservas-db-secret
type: Opaque
data:
  MYSQL_USER: {{ required "Falta database.credentials.user" .Values.database.credentials.user | b64enc | quote }}
  MYSQL_PASSWORD: {{ required "Falta database.credentials.password" .Values.database.credentials.password | b64enc | quote }}
  MYSQL_ROOT_PASSWORD: {{ required "Falta database.credentials.rootPassword" .Values.database.credentials.rootPassword | b64enc | quote }}
