apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-api
spec:
  replicas: {{ .Values.replicas.api }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: reservas-api
  template:
    metadata:
      labels:
        app: reservas-api
    spec:
      containers:
        - name: reservas-api
          image: "{{ .Values.images.api.repository }}:{{ .Values.images.api.tag }}"
          ports:
            - containerPort: {{ .Values.api.port }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          envFrom:
            - configMapRef:
                name: reservas-api-config
          env:
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: reservas-db-secret
                  key: MYSQL_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: reservas-db-secret
                  key: MYSQL_PASSWORD
          startupProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            periodSeconds: 5
            failureThreshold: 24
          readinessProbe:
            httpGet:
              path: /health
              port: {{ .Values.api.port }}
            periodSeconds: 5
            timeoutSeconds: 3
