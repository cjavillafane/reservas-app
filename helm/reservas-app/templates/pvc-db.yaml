apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: reservas-db-pvc
  annotations:
    helm.sh/resource-policy: keep
spec:
  accessModes:
    - ReadWriteOnce
  {{- if .Values.database.storageClassName }}
  storageClassName: {{ .Values.database.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.database.storage }}
