apiVersion: apps/v1
kind: Deployment
metadata:
  name: reservas-frontend
spec:
  replicas: {{ .Values.replicas.frontend }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: reservas-frontend
  template:
    metadata:
      labels:
        app: reservas-frontend
    spec:
      containers:
        - name: reservas-frontend
          image: "{{ .Values.images.frontend.repository }}:{{ .Values.images.frontend.tag }}"
          ports:
            - containerPort: {{ .Values.frontend.port }}
          envFrom:
            - configMapRef:
                name: reservas-frontend-config
          startupProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.frontend.port }}
            periodSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.frontend.port }}
            periodSeconds: 5
            timeoutSeconds: 3
