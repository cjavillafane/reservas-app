apiVersion: v1
kind: PersistentVolume
metadata:
  name: reservas-db-pv
  labels:
    app: reservas-db
spec:
  capacity:
    storage: 1Gi
  volumeMode: Filesystem
  accessModes:
    - ReadWriteOnce
  persistentVolumeReclaimPolicy: Retain
  storageClassName: ""
  hostPath:
    path: /var/lib/reservas-app/mysql
    type: DirectoryOrCreate
  claimRef:
    namespace: reservas-app
    name: reservas-db-pvc
